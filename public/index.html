<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AEGIS Defense System - Tactical AI Chatbot</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #0f172a; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
        @keyframes pulse-glow {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.8; }
        }
        .radar-sweep { animation: pulse-glow 2s infinite ease-in-out; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans h-screen flex flex-col overflow-hidden">

    <!-- Top Command Bar -->
    <header class="bg-slate-900 border-b border-cyan-800/50 px-6 py-3 flex justify-between items-center shadow-lg">
        <div class="flex items-center space-x-3">
            <div class="w-3 h-3 rounded-full bg-emerald-500 animate-ping"></div>
            <h1 class="text-xl font-bold tracking-wider text-cyan-400 font-mono">AEGIS // NATIONAL DEFENSE AI</h1>
        </div>
        <div class="flex items-center space-x-6 text-sm font-mono">
            <span class="text-slate-400">STATUS: <strong class="text-emerald-400">ONLINE</strong></span>
            <span class="text-slate-400">DEFCON: <strong class="text-amber-400">3</strong></span>
            <span class="text-slate-400">DATABASE: <strong class="text-cyan-400">SQLITE ACTIVE</strong></span>
        </div>
    </header>

    <!-- Main Container -->
    <div class="flex-1 flex overflow-hidden">

        <!-- Sidebar / Alerts Panel -->
        <aside class="w-80 bg-slate-900/60 border-r border-slate-800 p-4 flex flex-col hidden md:flex">
            <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3 font-mono">Active Threat Telemetry</h2>
            
            <div id="alertsContainer" class="flex-1 overflow-y-auto space-y-3 custom-scrollbar pr-1">
                <!-- Alerts dynamically loaded here -->
            </div>

            <!-- Quick Action Command Chips -->
            <div class="mt-4 pt-4 border-t border-slate-800">
                <p class="text-xs text-slate-400 font-mono mb-2">QUICK COMMANDS:</p>
                <div class="flex flex-col space-y-2">
                    <button onclick="quickSend('UAV drone incursion detected in Sector 4')" class="bg-slate-800 hover:bg-slate-700 text-cyan-300 text-xs py-1.5 px-3 rounded text-left border border-slate-700 font-mono transition">
                        ⚡ Drone Incursion Report
                    </button>
                    <button onclick="quickSend('Border breach attempt at ground perimeter')" class="bg-slate-800 hover:bg-slate-700 text-cyan-300 text-xs py-1.5 px-3 rounded text-left border border-slate-700 font-mono transition">
                        🚨 Perimeter Breach Action
                    </button>
                    <button onclick="quickSend('Get system health and status summary')" class="bg-slate-800 hover:bg-slate-700 text-cyan-300 text-xs py-1.5 px-3 rounded text-left border border-slate-700 font-mono transition">
                        📊 Defense Grid Summary
                    </button>
                </div>
            </div>
        </aside>

        <!-- Main Chat Panel -->
        <main class="flex-1 flex flex-col bg-slate-950">
            
            <!-- Chat Logs Container -->
            <div id="chatBox" class="flex-1 overflow-y-auto p-6 space-y-4 custom-scrollbar">
                <!-- Chat messages loaded here -->
            </div>

            <!-- Chat Input Form -->
            <form id="chatForm" class="p-4 bg-slate-900 border-t border-slate-800 flex space-x-3">
                <input 
                    type="text" 
                    id="userInput" 
                    placeholder="Enter military query, breach alert, or drone command..." 
                    class="flex-1 bg-slate-950 border border-slate-700 focus:border-cyan-500 text-slate-100 rounded-lg px-4 py-2.5 outline-none font-mono text-sm transition"
                    required
                />
                <button 
                    type="submit" 
                    class="bg-cyan-600 hover:bg-cyan-500 text-slate-950 font-bold px-6 py-2.5 rounded-lg text-sm transition font-mono flex items-center space-x-2"
                >
                    <span>TRANSMIT</span>
                </button>
            </form>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
